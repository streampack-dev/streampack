spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:tc:postgresql:@postgresVersion@://nevet
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true
    enabled: true
    out-of-order: true
  mail:
    host: localhost
    port: 3025

streampack:
  # Tests' HTTP servers are on localhost; production fetches only public addresses.
  fetch:
    allow-loopback: true
  security:
    enforce-external-secrets: false
  base-url: http://localhost:8080

springdoc:
  api-docs:
    enabled: true
