spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.properties
      - optional:file:../.env[.properties]
      - optional:file:../.env.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nevet}
    username: ${DB_USERNAME:nevet}
    password: ${DB_PASSWORD:nevet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true
    enabled: true
    out-of-order: true
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enabled: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}
  ai: {}
  application:
    name: nevet
    version: 3.0
streampack:
  base-url: ${BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:}
  otp:
    # Wrong sign-in codes a recipient may present before all its active codes are expired (#144).
    max-failed-attempts: ${OTP_MAX_FAILED_ATTEMPTS:5}
  console:
    enabled: ${CONSOLE_ENABLED:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@bytecode.news}
  irc:
    enabled: ${IRC_ENABLED:false}
    identity: ${IRC_IDENTITY:Nevet IRC Bridge}
    adaptive-send-delay-enabled: ${IRC_ADAPTIVE_SEND_DELAY_ENABLED:true}
    min-send-delay-ms: ${IRC_MIN_SEND_DELAY_MS:120}
    max-send-delay-ms: ${IRC_MAX_SEND_DELAY_MS:1000}
    send-delay-ramp-up-factor: ${IRC_SEND_DELAY_RAMP_UP_FACTOR:1.1}
    send-delay-ramp-down-factor: ${IRC_SEND_DELAY_RAMP_DOWN_FACTOR:0.9}
    send-delay-ms: ${IRC_SEND_DELAY_MS:900}
  blog:
    anonymous-submission: ${ANONYMOUS_SUBMISSION:false}
    site-name: ${BLOG_SITE_NAME:Nevet}
    base-url: ${BLOG_BASE_URL:http://localhost:3001}
    summary:
      # The system prompt for admins' AI summaries (#102); empty uses the built-in editorial stance.
      system-prompt: ${BLOG_SUMMARY_PROMPT:}
    outgoing:
      # A published post's links: mention them by Webmention/Pingback (#112), follow their sites'
      # feeds (#128).
      mentions: ${BLOG_MENTIONS_ENABLED:true}
      autosubscribe: ${BLOG_AUTOSUBSCRIBE_ENABLED:true}
  karma:
    immune-subjects: ${KARMA_IMMUNE_SUBJECTS:nevet}
  weather:
    api-key: ${OPENWEATHERMAP_API_KEY:change-me}
  discord:
    enabled: ${DISCORD_ENABLED:false}
    application-id: ${DISCORD_APPLICATION_ID:no-id}
    public-key: ${DISCORD_PUBLIC_KEY:no-key}
    permissions: 3072
    token: ${DISCORD_BOT_TOKEN:no-token}
    signal-character: "!"
  slack:
    enabled: ${SLACK_ENABLED:false}
    signal-character: ${SLACK_SIGNAL:!}
  mattermost:
    enabled: ${MATTERMOST_ENABLED:false}
    signal-character: ${MATTERMOST_SIGNAL:!}
    reconnect-delay: ${MATTERMOST_RECONNECT_DELAY:PT15S}
  security:
    enforce-external-secrets: ${STREAMPACK_SECURITY_ENFORCE_EXTERNAL_SECRETS:true}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    # Short names for the deployment's .env; STREAMPACK_AI_* still win, as the environment
    # outranks this file. The defaults match AiProperties'.
    model: ${AI_MODEL:claude-opus-5-5}
    moderation-model: ${AI_MODERATION_MODEL:claude-haiku-4-5-20251001}
    max-tokens: ${AI_MAX_TOKENS:1024}
    timeout: ${AI_TIMEOUT:60s}
    max-retries: ${AI_MAX_RETRIES:1}
    thinking: ${AI_THINKING:false}
    effort: ${AI_EFFORT:}
  rss:
    poll-interval: ${RSS_POLL_INTERVAL:PT1H}
    scheduler-interval: ${RSS_SCHEDULER_INTERVAL:PT90S}
    batch-size: ${RSS_POLL_BATCH_SIZE:5}
    max-backoff: ${RSS_POLL_MAX_BACKOFF:P1D}
    tags:
      promote-entries: ${RSS_TAG_PROMOTE_ENTRIES:3}
      promote-feeds: ${RSS_TAG_PROMOTE_FEEDS:2}
    # The model's hidden guess at admins' ratings of items (#187); off by default
    rating:
      model-guess: ${RSS_RATING_MODEL_GUESS:false}
      guess-interval: ${RSS_RATING_GUESS_INTERVAL:P1D}
      guess-lookback: ${RSS_RATING_GUESS_LOOKBACK:P2D}
      chunk-size: ${RSS_RATING_GUESS_CHUNK_SIZE:20}
      max-items-per-run: ${RSS_RATING_GUESS_MAX_ITEMS:200}
  github:
    poll-interval: ${GITHUB_POLL_INTERVAL:PT60M}
    scheduler-interval: ${GITHUB_SCHEDULER_INTERVAL:PT90S}
    batch-size: ${GITHUB_POLL_BATCH_SIZE:5}
    max-backoff: ${GITHUB_POLL_MAX_BACKOFF:P1D}
    webhook-secret-key: ${GITHUB_WEBHOOK_SECRET_KEY:}
    webhook-base-url: ${GITHUB_WEBHOOK_BASE_URL:change-me}
    delivery-dedupe-ttl: ${GITHUB_WEBHOOK_DEDUPE_TTL:PT6H}
  gitlab:
    enabled: ${GITLAB_ENABLED:false}
    poll-interval: ${GITLAB_POLL_INTERVAL:PT60M}
    scheduler-interval: ${GITLAB_SCHEDULER_INTERVAL:PT90S}
    batch-size: ${GITLAB_POLL_BATCH_SIZE:5}
    max-backoff: ${GITLAB_POLL_MAX_BACKOFF:P1D}
    webhook-secret-key: ${GITLAB_WEBHOOK_SECRET_KEY:}
    webhook-base-url: ${GITLAB_WEBHOOK_BASE_URL:change-me}
    delivery-dedupe-ttl: ${GITLAB_WEBHOOK_DEDUPE_TTL:PT6H}
management:
  info:
    git:
      mode: full
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info,health

springdoc:
  api-docs:
    enabled: true

logging:
  exception-conversion-word: "%wEx{0}"

server:
  server-header: ""
