spring:
  datasource:
    url: jdbc:tc:postgresql:@postgresVersion@://nevet
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true
    enabled: true
    out-of-order: true
  mail:
    host: localhost
    port: 3025
  threads:
    virtual:
      enabled: true

streampack:
  security:
    enforce-external-secrets: false
  base-url: http://localhost:8080
  # lib-testsupport depends on lib-core, so its shared test settings are not on this classpath.
  tick:
    scheduler:
      enabled: false
