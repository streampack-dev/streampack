spring:
  # lib-testsupport depends on lib-core, so lib-core cannot use its shared test settings; this
  # repeats their datasource, timeouts and retry window included (#325).
  datasource:
    url: jdbc:tc:postgresql:@postgresVersion@://nevet?connectTimeout=10&loginTimeout=10
    hikari:
      maximum-pool-size: 2
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true
    enabled: true
    out-of-order: true
  mail:
    host: localhost
    port: 3025
  threads:
    virtual:
      enabled: true

streampack:
  security:
    enforce-external-secrets: false
  base-url: http://localhost:8080
  # lib-testsupport depends on lib-core, so its shared test settings are not on this classpath.
  tick:
    scheduler:
      enabled: false
