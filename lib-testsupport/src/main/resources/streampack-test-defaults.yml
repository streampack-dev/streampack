spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    # The timeouts (seconds) and the retry window turn a connection that Docker drops into a
    # retry or a failure, not a run that hangs for good (#325).
    url: jdbc:tc:postgresql:@postgresVersion@://nevet?connectTimeout=10&loginTimeout=10
    hikari:
      maximum-pool-size: 2
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true
    enabled: true
    out-of-order: true
  mail:
    host: localhost
    port: 3025

streampack:
  # Tests' HTTP servers are on localhost; production fetches only public addresses.
  fetch:
    allow-loopback: true
  jwt:
    secret: test-jwt-secret-not-for-production-0123456789
  github:
    webhook-secret-key: test-github-webhook-secret-key
  base-url: http://localhost:8080
  tick:
    scheduler:
      enabled: false

springdoc:
  api-docs:
    enabled: true

# Tests log to the console only, at DEBUG for streampack's own code. The console line is the
# server's, with the full logger name, which captureLog reads.
logging:
  pattern:
    console: "%-5level [%thread] %logger : %msg%n"
  level:
    dev.streampack: DEBUG
    org.hibernate: WARN
    org.hibernate.orm.jdbc.error: ERROR
    com.github.dockerjava: WARN
